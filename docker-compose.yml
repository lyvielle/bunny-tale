services:
  bunny-chat:
    build: .
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HOST_PORT:-8001}:8000"
    # Every value comes from the environment (shell, CI/CD variables or a .env file next to this file).
    environment:
      BUNNY_API: ${BUNNY_API:-https://cutebunny.io}
      HWID_SALT: ${HWID_SALT:?set HWID_SALT (same value as Bunny Interactive)}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (any long random string)}
      AUTOWIPE_HOURS: ${AUTOWIPE_HOURS:-48}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      KLIPY_API_KEY: ${KLIPY_API_KEY:-}
      GIPHY_RATING: ${GIPHY_RATING:-pg-13}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-${BUNNY_API:-https://cutebunny.io}}
      REMEMBER_KEY: ${REMEMBER_KEY:-}
      VERIFY_TLS: ${VERIFY_TLS:-1}
      JANITOR_SECONDS: ${JANITOR_SECONDS:-300}
      SSE_MAX_AGE: ${SSE_MAX_AGE:-300}
    volumes:
      - ${DATA_MOUNT:-bunny-chat-data}:/data  # a volume name, or an absolute host path for a bind mount
    restart: unless-stopped

volumes:
  bunny-chat-data:
